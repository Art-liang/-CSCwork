    function copyTextSafely(text, onSuccess) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => onSuccess && onSuccess()).catch(() => fallbackCopy(text, onSuccess));
      } else {
        fallbackCopy(text, onSuccess);
      }
    }

    function fallbackCopy(text, onSuccess) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      if (onSuccess) onSuccess();
    }

      ];

                            <span className="px-2 py-0.5 text-xs font-bold bg-blue-100 text-blue-900 rounded">{rec.category}</span>
                          </div>
                          <div className="text-sm font-extrabold text-[#0F172A] pt-1">事件 / 需求：{rec.requestText}</div>
                          <div className="text-xs text-slate-700 leading-relaxed">更動 / 處置：{rec.actionText}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* 彈窗二：AI 一頁式 SEO 週報信 & 全體同仁流量戰報生成器 */}
          {aiMailModalSite && (
            <div className="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
              <div className="bg-white border-2 border-slate-300 rounded max-w-2xl w-full shadow-2xl overflow-hidden">
                <div className="px-5 py-3.5 bg-slate-900 text-white flex items-center justify-between">
                  <h3 className="text-sm font-extrabold">🤖 AI 報告與發信生成器 — {aiMailModalSite.name}</h3>
                  <button onClick={() => setAiMailModalSite(null)} className="px-2 py-0.5 bg-slate-800 rounded text-sm">✕</button>
                </div>
                <div className="p-5 space-y-3 text-xs">
                  <textarea rows={16} value={customMailBody} onChange={(e) => setCustomMailBody(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-300 rounded leading-relaxed" />
                  <div className="flex justify-end gap-2">
                    <button onClick={() => copyTextSafely(customMailBody, () => triggerToast('已複製完整信件內文！'))} className="px-4 py-2 font-bold bg-blue-600 text-white rounded">📋 一鍵複製信件內容發給同仁</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 彈窗三：Google 雲端資料庫即時同步設定 */}
          {showCloudModal && (
            <div className="fixed inset-0 z-50 bg-black/65 flex items-center justify-center p-4">
              <div className="bg-white border-2 border-slate-300 rounded-md max-w-xl w-full shadow-2xl overflow-hidden">
                <div className="px-5 py-3.5 bg-[#0F172A] text-white flex items-center justify-between">
                  <h3 className="text-base font-extrabold">☁️ Google 雲端資料庫即時同步設定</h3>
                  <button onClick={() => setShowCloudModal(false)} className="px-2 py-0.5 bg-slate-800 rounded text-sm font-bold">✕</button>
                </div>
                <div className="p-5 space-y-4 text-xs">
                  <p className="text-slate-600 leading-relaxed">
                    貼上你部署好的 <strong>Google Apps Script 網頁應用程式網址</strong>（<code>https://script.google.com/macros/s/.../exec</code>），設定完成後，你在手機或電腦新增的任何業務紀錄都會自動寫入雲端並跨裝置即時同步！
                  </p>
                  <input
                    type="text"
                    value={tempCloudUrl}
                    onChange={(e) => setTempCloudUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/xxxxxx/exec"
                    className="w-full px-3 py-2 font-mono bg-slate-50 border border-slate-300 rounded"
                  />
                  {cloudApiUrl && (
                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded space-y-1.5">
                      <div className="font-extrabold text-emerald-900">🔗 給主管或手機的「免設定自動連線專屬網址」：</div>
                      <button
                        onClick={() => {
                          const baseUrl = window.location.origin + window.location.pathname;
                          const shareLink = `${baseUrl}?cloud=${encodeURIComponent(cloudApiUrl)}`;
                          copyTextSafely(shareLink, () => triggerToast('已複製「免設定自動同步專屬網址」，可直接傳到 LINE 或給主管！'));
                        }}
                        className="px-3 py-1.5 font-extrabold bg-emerald-600 hover:bg-emerald-700 text-white rounded"
                      >
                        📋 複製免設定專屬同步網址
                      </button>
                    </div>
                  )}
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
                    <button onClick={() => setShowCloudModal(false)} className="px-3 py-2 font-bold bg-slate-100 rounded">取消</button>
                    <button
                      onClick={() => {
                        const clean = tempCloudUrl.trim();
                        setCloudApiUrl(clean);
                        try { localStorage.setItem('csc_cloud_api_url', clean); } catch {}
                        if (clean) {
                          pushToGoogleSheetCloud(sites, logs, siteHistories, clean);
                          triggerToast('已綁定 Google 雲端資料庫並上傳最新進度！');
                        }
                        setShowCloudModal(false);
                      }}
                      className="px-4 py-2 font-extrabold bg-blue-600 hover:bg-blue-700 text-white rounded"
                    >
                      儲存並立即同步雲端
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
